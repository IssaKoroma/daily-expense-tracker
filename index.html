<!DOCTYPE html>
<html>
<head>
  <title>Expense Tracker - Monthly</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; padding: 10px; background: #f0f0f0; }
    .box { background: white; padding: 15px; border-radius: 12px; }
    input, select, button { padding: 11px; margin: 4px 0; width: 100%; box-sizing: border-box; }
    .add-btn { background: green; color: white; border: none; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 8px; font-size: 13px; }
    th { background: #111; color: white; }
    .del-btn { background: red; color: white; border: none; padding: 5px; width: auto; }
  </style>
</head>
<body>
<div class="box">
  <h2>💰 Expense Tracker</h2>
  
  <label>Filter by Month:</label>
  <select id="monthFilter" onchange="renderTable()"></select>

  <hr>
  <input id="item" placeholder="Item e.g. Rice">
  <input id="amount" type="number" placeholder="Amount">
  <input id="date" type="date">
  <button class="add-btn" onclick="addExpense()">Add Expense</button>

  <table>
    <thead>
      <tr><th>Item</th><th>Amount</th><th>Date</th><th>Del</th></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <h3>Total for this Month: Le <span id="total">0</span></h3>
  <h4 style="color:green;">All Time Total: Le <span id="allTotal">0</span></h4>
</div>

<script>
  let expenses = JSON.parse(localStorage.getItem('myExpenses')) || [];
  document.getElementById('date').valueAsDate = new Date();

  function getMonthYear(dateStr) {
    let d = new Date(dateStr);
    return d.toLocaleString('en-GB', { month: 'long', year: 'numeric' }); // e.g. September 2026
  }

  function updateMonthFilter() {
    let months = [...new Set(expenses.map(e => getMonthYear(e.date)))];
    let filter = document.getElementById('monthFilter');
    filter.innerHTML = '<option value="All">All Months</option>';
    months.forEach(m => {
      filter.innerHTML += `<option value="${m}">${m}</option>`;
    });
    // Auto-select current month
    let current = getMonthYear(new Date());
    if(months.includes(current)) filter.value = current;
  }

  function renderTable() {
    let filter = document.getElementById('monthFilter').value;
    let tbody = document.getElementById('tableBody');
    tbody.innerHTML = "";
    let total = 0;
    let allTotal = 0;

    expenses.forEach((exp, index) => {
      allTotal += Number(exp.amount);
      let expMonth = getMonthYear(exp.date);
      if(filter !== "All" && expMonth !== filter) return;

      total += Number(exp.amount);
      let row = document.createElement('tr');
      row.innerHTML = `<td>${exp.item}</td><td>${exp.amount}</td><td>${new Date(exp.date).toLocaleDateString('en-GB')}</td><td><button class="del-btn" onclick="deleteRow(${index})">X</button></td>`;
      tbody.appendChild(row);
    });

    document.getElementById('total').textContent = total;
    document.getElementById('allTotal').textContent = allTotal;
    updateMonthFilter();
  }

  function addExpense() {
    let item = document.getElementById('item').value;
    let amount = document.getElementById('amount').value;
    let date = document.getElementById('date').value;
    if(!item || !amount || !date) return alert("Fill all");

    expenses.push({item, amount, date});
    localStorage.setItem('myExpenses', JSON.stringify(expenses));
    renderTable();
    document.getElementById('item').value = "";
    document.getElementById('amount').value = "";
  }

  function deleteRow(i) {
    expenses.splice(i, 1);
    localStorage.setItem('myExpenses', JSON.stringify(expenses));
    renderTable();
  }

  renderTable();
</script>
</body>
</html>
